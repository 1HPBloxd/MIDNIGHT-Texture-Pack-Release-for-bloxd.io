<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1HP Bloxd — Texture Packs</title>
<style>
  :root {
    --neon: #35d5ff;
    --bg-dark: #05070d;
    --card-bg: #0d1420;
    --text: #eaf6ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: radial-gradient(circle at 50% 20%, #0c1a2e 0%, #05070d 70%);
    color: var(--text);
    font-family: 'Segoe UI', Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  header {
    width: 100%;
    text-align: center;
    padding: 32px 16px 8px;
  }
  header h1 {
    font-size: 2.2rem;
    letter-spacing: 1px;
    color: var(--neon);
    text-shadow: 0 0 12px rgba(53, 213, 255, 0.6);
  }
  header p {
    margin-top: 8px;
    color: #9fb3c8;
    font-size: 0.95rem;
  }
  .grid {
    display: flex;
    flex-wrap: wrap;
    gap: 24px;
    justify-content: center;
    padding: 40px 24px;
    max-width: 1100px;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid rgba(53, 213, 255, 0.25);
    border-radius: 14px;
    width: 220px;
    overflow: hidden;
    text-align: center;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    text-decoration: none;
    color: inherit;
  }
  .card:hover {
    transform: translateY(-6px);
    box-shadow: 0 0 22px rgba(53, 213, 255, 0.35);
    border-color: var(--neon);
  }
  .card img {
    width: 100%;
    height: 220px;
    object-fit: cover;
    display: block;
  }
  .card-body {
    padding: 14px 10px 18px;
  }
  .card-body h3 {
    font-size: 1.1rem;
    color: var(--neon);
    text-shadow: 0 0 8px rgba(53, 213, 255, 0.5);
  }
  .card-body span {
    display: block;
    margin-top: 6px;
    font-size: 0.8rem;
    color: #7f92a6;
  }
  .download-btn {
    display: inline-block;
    margin-top: 12px;
    padding: 8px 18px;
    background: var(--neon);
    color: #05070d;
    font-weight: bold;
    border-radius: 8px;
    text-decoration: none;
    font-size: 0.85rem;
    letter-spacing: 0.5px;
  }
  .download-btn:hover {
    background: #6fe3ff;
  }
  footer {
    padding: 24px;
    text-align: center;
    color: #7f92a6;
    font-size: 0.85rem;
  }
  footer a {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: var(--text);
    text-decoration: none;
    margin: 0 12px;
    padding: 14px 32px;
    border-radius: 999px;
    font-size: 1.05rem;
    font-weight: 700;
    background: linear-gradient(180deg, #14514f 0%, #0a2b2a 100%);
    border: 2px solid rgba(255, 255, 255, 0.4);
    box-shadow:
      inset 0 2px 3px rgba(255, 255, 255, 0.25),
      inset 0 -4px 6px rgba(0, 0, 0, 0.4),
      0 4px 10px rgba(0, 0, 0, 0.5);
    transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
  }
  footer a:hover {
    transform: translateY(-3px);
    border-color: var(--neon);
    box-shadow:
      inset 0 2px 3px rgba(255, 255, 255, 0.3),
      inset 0 -4px 6px rgba(0, 0, 0, 0.4),
      0 6px 16px rgba(53, 213, 255, 0.35);
  }
  footer a:active {
    transform: translateY(0px);
    box-shadow:
      inset 0 3px 5px rgba(0, 0, 0, 0.5);
  }
</style>
</head>
<body>

  <header>
    <h1>1HP Bloxd — Texture Packs</h1>
    <p>Custom texture packs for Bloxd.io — made by 1HPBloxd</p>
  </header>

  <div class="grid">

    
    <a class="card" href="#">
      <img src="midnightpreview.png" alt="Midnight Pack preview">
      <div class="card-body">
        <h3>Midnight Pack</h3>
        <span>Last update: 8th August</span>
        <a class="download-btn" href="Midnight texture pack for bloxd.io.zip" download>Download</a>
      </div>
    </a>

    

  </div>

  <footer>
    <a href="https://youtube.com/@1HPBloxd" target="_blank">YouTube</a>
    |
    <a href="https://bloxd.io/" target="_blank">Play Bloxd</a>
  </footer>

</body>
</html>
